<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applied Jobs - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .application-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .application-card h3 {
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .application-card p {
            margin: 8px 0;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .applied {
            background: #cfe2ff;
            color: #084298;
        }

        .selected {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #842029;
        }

        .empty-message {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            color: #555;
            font-size: 16px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 18px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📋 My Applied Jobs</h2>

    <div id="applicationsContainer"></div>

    <a href="student-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

<script>

    const applicationsContainer =
        document.getElementById("applicationsContainer");

    function loadApplications() {

        const savedApplications =
            JSON.parse(localStorage.getItem("studentApplications")) || [];

        applicationsContainer.innerHTML = "";

        if (savedApplications.length === 0) {

            applicationsContainer.innerHTML = `
                <div class="empty-message">
                    <p>📭 You have not applied for any jobs yet.</p>
                    <p style="margin-top:10px;">
                        Go to <strong>Available Jobs</strong> and apply for a job.
                    </p>
                </div>
            `;

            return;
        }

        savedApplications.forEach(function(application) {

            let status = application.status || "Applied";

            let statusClass = "applied";

            if (status.toLowerCase() === "selected") {
                statusClass = "selected";
            }

            if (status.toLowerCase() === "rejected") {
                statusClass = "rejected";
            }

            const card = document.createElement("div");

            card.className = "application-card";

            card.innerHTML = `
                <h3>${application.jobName || "Job"}</h3>

                <p>
                    <strong>Company:</strong>
                    ${application.companyName || "Not specified"}
                </p>

                <p>
                    <strong>Location:</strong>
                    ${application.location || "Not specified"}
                </p>

                <p>
                    <strong>Salary:</strong>
                    ${application.salary || "Not specified"}
                </p>

                <p>
                    <strong>Applied Date:</strong>
                    ${application.appliedDate || "Recently"}
                </p>

                <span class="status ${statusClass}">
                    ${status}
                </span>
            `;

            applicationsContainer.appendChild(card);

        });
    }

    loadApplications();

</script>

</body>
</html>
