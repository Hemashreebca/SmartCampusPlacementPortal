<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applied Jobs - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .application-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .application-card h3 {
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .application-card p {
            margin: 8px 0;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .selected {
            background: #d4edda;
            color: #155724;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 18px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📋 My Applied Jobs</h2>

    <div class="application-card">

        <h3>Web Developer</h3>

        <p>
            <strong>Company:</strong>
            ABC Technologies
        </p>

        <p>
            <strong>Location:</strong>
            Chennai
        </p>

        <p>
            <strong>Salary:</strong>
            5 LPA
        </p>

        <p>
            <strong>Applied Date:</strong>
            15-08-2026
        </p>

        <span class="status pending">
            Application Pending
        </span>

    </div>

    <div class="application-card">

        <h3>Data Analyst</h3>

        <p>
            <strong>Company:</strong>
            XYZ Solutions
        </p>

        <p>
            <strong>Location:</strong>
            Bangalore
        </p>

        <p>
            <strong>Salary:</strong>
            6 LPA
        </p>

        <p>
            <strong>Applied Date:</strong>
            16-08-2026
        </p>

        <span class="status selected">
            Selected ✅
        </span>

    </div>

    <a href="student-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
