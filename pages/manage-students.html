<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0d47a1;
            color: white;
        }

        .status {
            color: #198754;
            font-weight: bold;
        }

        button {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            background: #c62828;
            color: white;
            cursor: pointer;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>👨‍🎓 Manage Students</h2>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>ST001</td>
                    <td>Hema</td>
                    <td>hema@gmail.com</td>
                    <td>BCA</td>
                    <td class="status">Active</td>
                    <td>
                        <button onclick="removeStudent(this)">
                            Remove
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>ST002</td>
                    <td>Lavanya</td>
                    <td>lavanya@gmail.com</td>
                    <td>BCA</td>
                    <td class="status">Active</td>
                    <td>
                        <button onclick="removeStudent(this)">
                            Remove
                        </button>
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

    <a href="admin-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

<script>
    function removeStudent(button) {
        const row = button.closest("tr");
        const name = row.children[1].textContent;

        if (confirm("Remove " + name + " from the student list?")) {
            row.remove();
            alert("✅ Student removed successfully.");
        }
    }
</script>

</body>
</html>
