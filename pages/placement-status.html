<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Status - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .status-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .status-card h3 {
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .status-card p {
            margin: 8px 0;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .applied {
            background: #d4edda;
            color: #155724;
        }

        .not-applied {
            background: #f8d7da;
            color: #721c24;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 18px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📋 Placement Status</h2>

    <div class="status-card">

        <h3>Web Developer</h3>

        <p>
            <strong>Company:</strong>
            ABC Technologies
        </p>

        <p>
            <strong>Location:</strong>
            Chennai
        </p>

        <p>
            <strong>Salary:</strong>
            5 LPA
        </p>

        <span id="webDeveloperStatus" class="status not-applied">
            Not Applied
        </span>

    </div>

    <div class="status-card">

        <h3>Data Analyst</h3>

        <p>
            <strong>Company:</strong>
            XYZ Solutions
        </p>

        <p>
            <strong>Location:</strong>
            Bangalore
        </p>

        <p>
            <strong>Salary:</strong>
            6 LPA
        </p>

        <span id="dataAnalystStatus" class="status not-applied">
            Not Applied
        </span>

    </div>

    <a href="student-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

<script>

    const applications =
        JSON.parse(localStorage.getItem("studentApplications")) || [];

    const webDeveloperApplied = applications.some(
        application => application.jobKey === "webdeveloper"
    );

    const dataAnalystApplied = applications.some(
        application => application.jobKey === "dataanalyst"
    );

    const webStatus =
        document.getElementById("webDeveloperStatus");

    const dataStatus =
        document.getElementById("dataAnalystStatus");


    if (webDeveloperApplied) {

        webStatus.textContent = "Applied ✅";
        webStatus.className = "status applied";

    } else {

        webStatus.textContent = "Not Applied";
        webStatus.className = "status not-applied";

    }


    if (dataAnalystApplied) {

        dataStatus.textContent = "Applied ✅";
        dataStatus.className = "status applied";

    } else {

        dataStatus.textContent = "Not Applied";
        dataStatus.className = "status not-applied";

    }

</script>

</body>
</html>
