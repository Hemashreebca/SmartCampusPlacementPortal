<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Interview - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0d47a1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0d47a1;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>📅 Schedule Interview</h2>

        <form id="interviewForm">

            <div class="form-group">
                <label for="student">Select Student</label>

                <select id="student" required>
                    <option value="">-- Select Student --</option>
                    <option value="Hema">Hema</option>
                    <option value="Lavanya">Lavanya</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Student Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Student email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="job">Job Role</label>
                <input
                    type="text"
                    id="job"
                    value="Web Developer"
                    required
                >
            </div>

            <div class="form-group">
                <label for="date">Interview Date</label>
                <input
                    type="date"
                    id="date"
                    required
                >
            </div>

            <div class="form-group">
                <label for="time">Interview Time</label>
                <input
                    type="time"
                    id="time"
                    required
                >
            </div>

            <div class="form-group">
                <label for="mode">Interview Mode</label>

                <select id="mode">
                    <option>Online</option>
                    <option>Offline</option>
                </select>
            </div>

            <div class="form-group">
                <label for="location">
                    Interview Location / Meeting Link
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter location or meeting link"
                >
            </div>

            <div class="form-group">
                <label for="message">Additional Message</label>

                <textarea
                    id="message"
                    rows="4"
                    placeholder="Enter interview instructions..."
                ></textarea>
            </div>

            <button type="submit">
                ✅ Schedule Interview
            </button>

        </form>

        <a href="company-dashboard.html" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>
    document.getElementById("student").addEventListener("change", function () {

        const email = document.getElementById("email");

        if (this.value === "Hema") {
            email.value = "hema@gmail.com";
        }

        else if (this.value === "Lavanya") {
            email.value = "lavanya@gmail.com";
        }

        else {
            email.value = "";
        }

    });

    document.getElementById("interviewForm").addEventListener("submit", function(event) {

        event.preventDefault();

        alert("✅ Interview scheduled successfully!");

        window.location.href = "company-dashboard.html";

    });
</script>

</body>
</html>
