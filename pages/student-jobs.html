<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Jobs - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .job-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .job-card h3 {
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .job-card p {
            margin: 8px 0;
        }

        .apply-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 11px 20px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 5px;
            padding: 11px 18px;
            background: #777;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>💼 Available Jobs</h2>

    <div class="job-card">

        <h3>Web Developer</h3>

        <p>
            <strong>Company:</strong>
            ABC Technologies
        </p>

        <p>
            <strong>Location:</strong>
            Chennai
        </p>

        <p>
            <strong>Salary:</strong>
            5 LPA
        </p>

        <p>
            <strong>Skills:</strong>
            HTML, CSS, JavaScript
        </p>

        <a href="apply-job.html?job=webdeveloper" class="apply-btn">
            Apply Now
        </a>

    </div>

    <div class="job-card">

        <h3>Data Analyst</h3>

        <p>
            <strong>Company:</strong>
            XYZ Solutions
        </p>

        <p>
            <strong>Location:</strong>
            Bangalore
        </p>

        <p>
            <strong>Salary:</strong>
            6 LPA
        </p>

        <p>
            <strong>Skills:</strong>
            Python, Excel, SQL
        </p>

        <a href="apply-job.html?job=dataanalyst" class="apply-btn">
            Apply Now
        </a>

    </div>

    <a href="student-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
