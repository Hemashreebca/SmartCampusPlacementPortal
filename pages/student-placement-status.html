<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Status - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .status-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .status-card h3 {
            color: #0d47a1;
            margin-bottom: 12px;
        }

        .status-card p {
            margin: 8px 0;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .selected {
            background: #d4edda;
            color: #155724;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 11px 18px;
            background: #0d47a1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📊 My Placement Status</h2>

    <div class="status-card">

        <h3>ABC Technologies</h3>

        <p>
            <strong>Job Role:</strong>
            Web Developer
        </p>

        <p>
            <strong>Selection Date:</strong>
            15-08-2026
        </p>

        <span class="status selected">
            Selected ✅
        </span>

    </div>

    <div class="status-card">

        <h3>XYZ Solutions</h3>

        <p>
            <strong>Job Role:</strong>
            Data Analyst
        </p>

        <p>
            <strong>Interview Date:</strong>
            20-08-2026
        </p>

        <span class="status pending">
            Pending ⏳
        </span>

    </div>

    <a href="student-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
