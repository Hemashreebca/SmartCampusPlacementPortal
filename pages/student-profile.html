<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 800px;
            margin: auto;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0d47a1;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .info {
            margin-bottom: 18px;
            padding: 12px;
            background: #f4f7fb;
            border-radius: 6px;
        }

        .info strong {
            display: block;
            margin-bottom: 5px;
            color: #0d47a1;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            margin: 5px;
            border-radius: 6px;
            text-decoration: none;
            background: #0d47a1;
            color: white;
        }

        .back {
            background: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="profile-card">

        <div class="profile-icon">👩‍🎓</div>

        <h2>My Profile</h2>

        <div class="info">
            <strong>Full Name</strong>
            Hema
        </div>

        <div class="info">
            <strong>Email</strong>
            hema@gmail.com
        </div>

        <div class="info">
            <strong>Phone Number</strong>
            9876543210
        </div>

        <div class="info">
            <strong>Course</strong>
            BCA
        </div>

        <div class="info">
            <strong>College</strong>
            Your College Name
        </div>

        <div class="info">
            <strong>Skills</strong>
            HTML, CSS, JavaScript, Python
        </div>

        <div class="info">
            <strong>Address</strong>
            Tamil Nadu, India
        </div>

        <div class="buttons">

            <a href="update-profile.html" class="btn">
                ✏️ Update Profile
            </a>

            <a href="student-dashboard.html" class="btn back">
                ← Back to Dashboard
            </a>

        </div>

    </div>

</div>

</body>
</html>
