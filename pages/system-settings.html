<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 650px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .setting:last-of-type {
            border-bottom: none;
        }

        .setting h3 {
            color: #0d47a1;
            margin-bottom: 5px;
        }

        .setting p {
            color: #666;
            font-size: 14px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .save-btn {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0d47a1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0d47a1;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>⚙️ System Settings</h2>

        <form id="settingsForm">

            <div class="setting">
                <div>
                    <h3>Email Notifications</h3>
                    <p>Enable email notification alerts.</p>
                </div>

                <input type="checkbox" checked>
            </div>

            <div class="setting">
                <div>
                    <h3>Application Notifications</h3>
                    <p>Receive alerts when students apply for jobs.</p>
                </div>

                <input type="checkbox" checked>
            </div>

            <div class="setting">
                <div>
                    <h3>Interview Notifications</h3>
                    <p>Receive interview scheduling alerts.</p>
                </div>

                <input type="checkbox" checked>
            </div>

            <div class="setting">
                <div>
                    <h3>Portal Language</h3>
                    <p>Select the portal display language.</p>
                </div>

                <select>
                    <option>English</option>
                    <option>Tamil</option>
                </select>
            </div>

            <button type="submit" class="save-btn">
                💾 Save Settings
            </button>

        </form>

        <a href="admin-dashboard.html" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</div>

<script>
    document.getElementById("settingsForm").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("✅ Settings saved successfully!");
    });
</script>

</body>
</html>
