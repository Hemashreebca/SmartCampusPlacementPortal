<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile - Smart Campus Placement Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #0d47a1;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0d47a1;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>✏️ Update Student Profile</h2>

        <form id="updateProfileForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" value="Hema" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="hema@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" value="9876543210">
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <input type="text" id="course" value="BCA">
            </div>

            <div class="form-group">
                <label for="college">College</label>
                <input type="text" id="college" value="Your College Name">
            </div>

            <div class="form-group">
                <label for="skills">Skills</label>
                <textarea id="skills" rows="4">HTML, CSS, JavaScript, Python</textarea>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="3">Tamil Nadu, India</textarea>
            </div>

            <button type="submit">
                💾 Save Changes
            </button>

        </form>

        <a href="student-profile.html" class="back-btn">
            ← Back to Profile
        </a>

    </div>

</div>

<script>
    document.getElementById("updateProfileForm").addEventListener("submit", function(event) {
        event.preventDefault();

        alert("✅ Profile updated successfully!");

        window.location.href = "student-profile.html";
    });
</script>

</body>
</html>
